name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-nextjs-bun@1417493f40c23b8826601ac9de8d7abda0b84ec6 # v1.15
        with:
          install-playwright: "true"
          playwright-browsers: "chromium"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Smoke the production build
        run: bun run test:e2e
        env:
          PW_WEB_COMMAND: bunx next start -p 4720
      # Hydration mismatches are only reported by React's development build.
      # Turbopack dev on next 16.4.0 fails Pages Router modules on cold routes (vercel/next.js#99789), so the dev smoke uses webpack.
      - name: Smoke the dev server
        run: bun run test:e2e
        env:
          PW_WEB_COMMAND: bunx next dev --webpack -p 4720
